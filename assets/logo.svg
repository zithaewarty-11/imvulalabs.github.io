  <circle class="node" cx="140" cy="120" r="4"/>
  <circle class="node" cx="100" cy="150" r="4"/>
  <circle class="node" cx="120" cy="45" r="4"/>
  <circle class="node" cx="140" cy="70" r="4"/>
