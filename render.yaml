services:
  - type: web
    name: imvula-os-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: imvula-os/backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: imvula-os-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://zithaewarty-11.github.io"
      - key: AI_PROVIDER
        value: mock
      - key: JWT_EXPIRY_MINUTES
        value: "60"

databases:
  - name: imvula-os-db
    plan: free
    region: frankfurt
    databaseName: imvula
    user: imvula
