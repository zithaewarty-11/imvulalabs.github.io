<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://imvula-os-api-xs76.onrender.com; img-src 'self' data:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Imvula Labs</title>
    <meta name="description" content="Sign in to your Imvula Labs workspace or create a new account.">
    <link rel="stylesheet" href="../style.css">
    <style>
        .auth-section { max-width: 480px; margin: 60px auto; padding: 0 20px 60px; }
        .auth-card { background: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border: 1px solid #e5e7eb; }
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #e5e7eb; }
        .auth-tab { flex: 1; padding: 12px 0; border: none; background: none; cursor: pointer; font-size: 15px; font-weight: 600; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .auth-tab.active { color: #111827; border-bottom-color: #2563eb; }
        .auth-form { display: none; flex-direction: column; gap: 16px; }
        .auth-form.active { display: flex; }
        .auth-form label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; display: block; }
        .auth-form input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .auth-form input:focus { outline: none; border-color: #2563eb; }
        .auth-form button[type="submit"] { padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .auth-form button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-error { padding: 10px 14px; background: #fef2f2; color: #991b1b; border-radius: 6px; font-size: 14px; margin-bottom: 16px; display: none; }
        .auth-error.show { display: block; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #6b7280; }
        .auth-footer a { color: #2563eb; text-decoration: none; }
        @media (max-width: 768px) {
            .navbar { flex-wrap: wrap; }
            #navMenu { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
<header class="navbar">
    <a href="../index.html" class="brand">
        <img src="../assets/logo.svg" alt="Imvula Labs logo">
        <span>Imvula<span class="accent">Labs</span></span>
    </a>
    <nav id="navMenu">
        <a href="../index.html#services">Services</a>
        <a href="../index.html#about">About</a>
        <a href="../index.html#contact">Contact</a>
    </nav>
</header>
<main>
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Sign In</button>
            <button class="auth-tab" data-tab="register">Create Account</button>
        </div>
        <div class="auth-error" id="authError"></div>

        <form class="auth-form active" id="loginForm">
            <div>
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required autocomplete="email">
            </div>
            <div>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required autocomplete="current-password">
            </div>
            <button type="submit" id="loginBtn">Sign In</button>
        </form>

        <form class="auth-form" id="registerForm">
            <div>
                <label for="registerOrg">Business Name</label>
                <input type="text" id="registerOrg" required minlength="2" autocomplete="organization">
            </div>
            <div>
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" required autocomplete="email">
            </div>
            <div>
                <label for="registerPassword">Password (min 8 characters)</label>
                <input type="password" id="registerPassword" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" id="registerBtn">Create Account</button>
        </form>

        <div class="auth-footer">
            <a href="../index.html">← Back to home</a>
        </div>
    </div>
</section>

</main>
<footer>
    <div class="footer-brand"><img src="../assets/logo.svg" alt="Imvula Labs"><strong>Imvula Labs</strong></div>
    <p>© 2026 Imvula Labs. Ethical Cybersecurity. All demo data is simulated.</p>
</footer>
<script src="../js/imvula-config.js"></script>
<script src="../js/imvula-auth.js"></script>
<script>
(function () {
  // If already signed in, skip the login page entirely
  if (window.ImvulaAuth && window.ImvulaAuth.isLoggedIn()) {
    window.location.href = window.IMVULA.url("pages/dashboard.html");
    return;
  }

  var tabs = document.querySelectorAll(".auth-tab");
  var loginForm = document.getElementById("loginForm");
  var registerForm = document.getElementById("registerForm");
  var errorBox = document.getElementById("authError");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }
  function clearError() {
    errorBox.textContent = "";
    errorBox.classList.remove("show");
  }

  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      var target = tab.getAttribute("data-tab");
      tabs.forEach(function (t) { t.classList.toggle("active", t === tab); });
      loginForm.classList.toggle("active", target === "login");
      registerForm.classList.toggle("active", target === "register");
      clearError();
    });
  });

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    clearError();
    var btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Signing in...";

    window.ImvulaAuth.login(
      document.getElementById("loginEmail").value.trim(),
      document.getElementById("loginPassword").value
    ).then(function () {
      window.location.href = window.IMVULA.url("pages/dashboard.html");
    }).catch(function (err) {
      showError(err.message || "Sign-in failed");
      btn.disabled = false;
      btn.textContent = "Sign In";
    });
  });

  registerForm.addEventListener("submit", function (e) {
    e.preventDefault();
    clearError();
    var btn = document.getElementById("registerBtn");
    btn.disabled = true;
    btn.textContent = "Creating account...";

    window.ImvulaAuth.register(
      document.getElementById("registerEmail").value.trim(),
      document.getElementById("registerPassword").value,
      document.getElementById("registerOrg").value.trim()
    ).then(function () {
      window.location.href = window.IMVULA.url("pages/dashboard.html");
    }).catch(function (err) {
      showError(err.message || "Registration failed");
      btn.disabled = false;
      btn.textContent = "Create Account";
    });
  });
})();
</script>
</body>
</html>
