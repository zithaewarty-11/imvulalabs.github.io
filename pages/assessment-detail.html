<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Details — Imvula Labs</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .detail-card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
        .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #94a3b8; font-weight: 600; }
        .detail-value { color: #fff; text-align: right; max-width: 60%; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.pending { background: #eab308; color: #0a0e17; }
        .badge.in_progress { background: #3b82f6; color: #fff; }
        .badge.completed { background: #00ff9d; color: #0a0e17; }
        .badge.critical { background: #ef4444; color: #fff; }
        .badge.high { background: #f97316; color: #fff; }
        .badge.medium { background: #eab308; color: #0a0e17; }
        .badge.low { background: #00ff9d; color: #0a0e17; }
    </style>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../assets/logo.svg" alt="Imvula Labs">
            <span>Imvula<span class="accent">Labs</span></span>
        </div>
        <nav>
            <a href="dashboard.html"><span class="icon">◈</span><span>Dashboard</span></a>
            <a href="assessments.html" class="active"><span class="icon">📋</span><span>Assessments</span></a>
            <a href="assets.html"><span class="icon">⌬</span><span>Assets</span></a>
            <a href="vulnerabilities.html"><span class="icon">⌁</span><span>Risks</span></a>
            <a href="reports.html"><span class="icon">▣</span><span>Reports</span></a>
            <a href="ai-security.html"><span class="icon">◎</span><span>AI Agents</span></a>
            <a href="#" id="logoutLink"><span class="icon">↩</span><span>Sign Out</span></a>
        </nav>
        <div class="sidebar-footer" id="userFooter">—</div>
    </aside>
    
    <main class="main-content">
        <div style="margin-bottom: 20px;">
            <a href="assessments.html" style="color: #00ff9d; text-decoration: none; font-size: 14px;">← Back to Assessments</a>
        </div>
        <div id="assessmentDetail">
            <p style="color: #94a3b8;">Loading assessment details...</p>
        </div>
    </main>
</div>
<script src="../js/imvula-config.js"></script>
<script src="../js/imvula-auth.js"></script>
<script src="../js/assessments.js"></script>
</body>
</html>
